        /* =====================================================
           编辑器（收藏条目）
        ===================================================== */
        function openItemEditor(type, item) {
            const isNew = !item;
            const it = item || { type, title: '', note: '' };
            const info = getTypeInfo(type);
            let fields = '';

            if (it.isFolder) {
                openModal(`<h3>编辑类别</h3>
                  <label>类别名称<input type="text" id="f-title" value="${esc(it.title || '')}"></label>
                  <div class="modal-actions"><button class="btn danger" id="f-del">删除</button><span class="sp"></span><button class="btn ghost" id="f-cancel">取消</button><button class="btn" id="f-save">保存</button></div>`);
                $('#f-cancel').onclick = closeModal;
                $('#f-save').onclick = async () => {
                    const t = $('#f-title').value.trim();
                    if (!t) { toast('请填写名称', true); return; }
                    it.title = t; it.updatedAt = Date.now();
                    await idbPut('items', it); await loadAll(); closeModal(); renderContent(); toast('已保存');
                };
                $('#f-del').onclick = async () => {
                    const subItems = state.items.filter(x => x.parentId === it.id);
                    let msg = `确定删除类别「${it.title}」吗？`;
                    if (subItems.length) msg += `\n\n该类别下有 ${subItems.length} 项内容，会一并删除。`;
                    if (!confirm(msg)) return;
                    async function delRecursive(id) {
                        const children = state.items.filter(x => x.parentId === id);
                        for (const ch of children) { if (ch.isFolder) await delRecursive(ch.id); revokeURL(ch.id); await idbDel('items', ch.id); }
                    }
                    await delRecursive(it.id);
                    await idbDel('items', it.id);
                    await loadAll(); closeModal(); renderNav(); renderContent(); toast('已删除');
                };
                return;
            }

            if (type === 'image') {
                fields = `<label>标题<input type="text" id="f-title" value="${esc(it.title || '')}" placeholder="给这张图起个名字"></label>
                  <label>来源 / 原文件路径<input type="text" id="f-source" value="${esc(it.source || '')}" placeholder="可选"></label>
                  <label>备注<textarea id="f-note" placeholder="可选">${esc(it.note || '')}</textarea></label>
                  <label>更换图片</label><button class="btn ghost" id="f-cover" style="width:100%;margin-bottom:12px">选择新图片</button>`;
            } else if (type === 'site') {
                fields = `<label>标题<input type="text" id="f-title" value="${esc(it.title || '')}" placeholder="留空则用域名"></label>
                  <label>网址<input type="text" id="f-url" value="${esc(it.url || '')}" placeholder="https://..."></label>
                  <label>备注<textarea id="f-note" placeholder="可选">${esc(it.note || '')}</textarea></label>`;
            } else if (type === 'anime') {
                fields = `<label>名称<input type="text" id="f-title" value="${esc(it.title || '')}"></label>
                  <div class="row">
                    <label>状态<select id="f-status">${ANIME_STATUS.map(s => `<option ${it.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
                    <label>看到第几集<input type="number" id="f-cur" min="0" value="${it.currentEp || 0}"></label>
                    <label>总集数<input type="number" id="f-total" min="0" value="${it.totalEp || 0}"></label>
                  </div>
                  <label>备注<textarea id="f-note" placeholder="可选">${esc(it.note || '')}</textarea></label>
                  <label>封面</label><button class="btn ghost" id="f-cover" style="width:100%;margin-bottom:12px">选择/更换封面图片</button>`;
            } else {
                fields = `<label>标题<input type="text" id="f-title" value="${esc(it.title || '')}" placeholder="给这条内容起个名字"></label>
                  <label>网址（可选，填了点击卡片就能跳转）<input type="text" id="f-url" value="${esc(it.url || '')}" placeholder="https://..."></label>
                  <label>备注<textarea id="f-note" placeholder="可选">${esc(it.note || '')}</textarea></label>
                  <label>封面（可选）</label><button class="btn ghost" id="f-cover" style="width:100%;margin-bottom:12px">选择/更换封面图片</button>`;
            }

            openModal(`<h3>${isNew ? '添加' : '编辑'}${esc(info.name)}</h3>${fields}<div class="modal-actions">${isNew ? '' : '<button class="btn danger" id="f-del">删除</button>'}<span class="sp"></span><button class="btn ghost" id="f-cancel">取消</button><button class="btn" id="f-save">保存</button></div>`);

            let pendingBlob = null;
            const coverBtn = $('#f-cover');
            if (coverBtn) {
                coverBtn.onclick = () => {
                    const inp = document.createElement('input'); inp.type = 'file';
                    inp.accept = type === 'image' ? 'image/*,video/*' : 'image/*';
                    inp.onchange = async () => {
                        const f = inp.files[0]; if (!f) return;
                        try {
                            let thumb = f.type.startsWith('video/') ? await grabVideoFrame(f) : await compressImage(f);
                            pendingBlob = thumb.blob;
                            if (!isNew) {
                                it.blob = thumb.blob;
                                if (type === 'image' && f.type.startsWith('video/')) it.isVideo = true;
                                else if (type === 'image') it.isVideo = false;
                                await idbPut('items', it);
                                await loadAll(); revokeURL(it.id); renderContent(false);
                                toast('图片已更新');
                            } else toast('已选择，记得保存');
                        } catch (e) { toast('处理失败', true); }
                    };
                    inp.click();
                };
            }

            $('#f-cancel').onclick = closeModal;
            $('#f-save').onclick = async () => {
                const title = ($('#f-title')?.value || '').trim();
                const note = ($('#f-note')?.value || '').trim();
                const obj = { ...it, type, note, updatedAt: Date.now() };
                if (!obj.createdAt) obj.createdAt = Date.now();
                if (!obj.id) obj.id = uid();
                if (pendingBlob) obj.blob = pendingBlob;
                if (!obj.parentId && state.currentFolderId) obj.parentId = state.currentFolderId;
                else if (obj.parentId === undefined) obj.parentId = null;

                if (type === 'image') { obj.title = title || '未命名'; obj.source = ($('#f-source')?.value || '').trim(); }
                else if (type === 'site') {
                    const url = ($('#f-url')?.value || '').trim();
                    if (!url) { toast('请填写网址', true); return; }
                    obj.url = /^https?:\/\//i.test(url) ? url : 'https://' + url;
                    if (!title) { try { obj.title = new URL(obj.url).hostname.replace(/^www\./, ''); } catch (e) { obj.title = obj.url; } } else obj.title = title;
                }
                else if (type === 'anime') {
                    if (!title) { toast('请填写名称', true); return; }
                    obj.title = title;
                    obj.status = $('#f-status').value;
                    obj.currentEp = Number($('#f-cur').value) || 0;
                    obj.totalEp = Number($('#f-total').value) || 0;
                }
                else {
                    if (!title) { toast('请填写标题', true); return; }
                    obj.title = title;
                    const url = ($('#f-url')?.value || '').trim();
                    if (url) obj.url = /^https?:\/\//i.test(url) ? url : 'https://' + url;
                }

                await idbPut('items', obj);
                await loadAll(); closeModal(); renderNav(); renderContent(); toast('已保存');
            };

            if (!isNew) {
                $('#f-del').onclick = async () => {
                    if (!confirm('确定删除这条收藏吗？')) return;
                    revokeURL(it.id); await idbDel('items', it.id);
                    await loadAll(); closeModal(); renderNav(); renderContent(); toast('已删除');
                };
            }
        }

        /* =====================================================
           计划编辑器（新建 / 编辑计划）
        ===================================================== */
        function openPlanEditor(plan) {
            const isNew = !plan;
            const base = plan || { name: '', icon: 'flag', color: '#4F6BFF', kind: 'check', unit: '', entries: [] };
            let draft = (base.entries || []).map(e => ({
                id: e.id || uid(), name: e.name || '',
                freqDays: e.freqDays || '', lastCheckinDate: e.lastCheckinDate || null,
            }));
            if (!draft.length) draft.push({ id: uid(), name: '', freqDays: '', lastCheckinDate: null });
            let pickedIcon = base.icon || 'flag';
            let pickedColor = base.color || '#4F6BFF';
            let kind = base.kind || 'check';
            const iconKeys = Object.keys(ICON_LIB);

            function syncDraft() {
                const n = $('#p-name'); if (n) base.name = n.value;
                const u = $('#p-unit'); if (u) base.unit = u.value;
                $$('[data-entry-name]').forEach(inp => {
                    const i = Number(inp.dataset.entryName);
                    if (draft[i]) draft[i].name = inp.value;
                });
                $$('[data-entry-freq]').forEach(inp => {
                    const i = Number(inp.dataset.entryFreq);
                    if (draft[i]) draft[i].freqDays = inp.value === '' ? '' : Number(inp.value);
                });
            }

            function entriesHTML() {
                const ph = kind === 'number' ? '成员名字，比如 我 / 家人 / 老婆' : '任务名，比如 每天喂鱼 / 定期换水';
                return draft.map((en, i) => `
                            <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
                              <input type="text" data-entry-name="${i}" value="${esc(en.name)}" placeholder="${ph}"
                                style="flex:1;min-width:140px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#F9FAFB;color:var(--text);font-size:14px;font-family:inherit;outline:none">
                              ${kind === 'frequency' ? (() => {
                        const presets = [1, 2, 3, 5, 7, 14, 30, 90, 180];
                        const cur = Number(en.freqDays) || 1;
                        const opts = presets.includes(cur) ? presets : [...presets, cur].sort((a, b) => a - b);
                        const label = v => ({ 1: '每天', 2: '每2天', 3: '每3天', 5: '每5天', 7: '每周', 14: '每两周', 30: '每月', 90: '每季度', 180: '每半年' }[v] || `每${v}天`);
                        return `<select data-entry-freq="${i}"
                                  style="width:118px;padding:10px 10px;border-radius:10px;border:1px solid var(--border);background:#F9FAFB;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;cursor:pointer">
                                  ${opts.map(v => `<option value="${v}" ${cur === v ? 'selected' : ''}>${label(v)}</option>`).join('')}
                                </select>`;
                    })() : ''}
                              <button class="btn danger" data-entry-del="${i}" style="padding:10px 14px;border-radius:10px">删除</button>
                            </div>`).join('');
            }

            function bindEditor() {
                $$('#iconPicker .icon-opt, #iconPickerMore .icon-opt').forEach(el => {
                    el.onclick = () => {
                        pickedIcon = el.dataset.icon;
                        $$('#iconPicker .icon-opt, #iconPickerMore .icon-opt').forEach(x => x.classList.toggle('selected', x.dataset.icon === el.dataset.icon));
                    };
                });
                const moreBtnP = $('#iconMoreBtn');
                if (moreBtnP) moreBtnP.onclick = () => {
                    const m = $('#iconPickerMore');
                    const showing = m.style.display !== 'none';
                    m.style.display = showing ? 'none' : 'grid';
                    moreBtnP.textContent = showing ? '＋ 更多图标' : '− 收起更多';
                };
                $$('#colorPicker .color-opt').forEach(el => {
                    el.onclick = () => { pickedColor = el.dataset.color; $$('#colorPicker .color-opt').forEach(x => x.classList.toggle('selected', x === el)); };
                });
                $('#p-kind').onchange = ev => { syncDraft(); kind = ev.target.value; renderEditor(); };
                $('#p-add-entry').onclick = () => { syncDraft(); draft.push({ id: uid(), name: '', freqDays: '', lastCheckinDate: null }); renderEditor(); };
                $$('[data-entry-del]').forEach(b => {
                    b.onclick = () => {
                        syncDraft();
                        draft.splice(Number(b.dataset.entryDel), 1);
                        if (!draft.length) draft.push({ id: uid(), name: '', freqDays: '', lastCheckinDate: null });
                        renderEditor();
                    };
                });
                $('#p-cancel').onclick = closeModal;
                $('#p-save').onclick = async () => {
                    syncDraft();
                    const name = ($('#p-name').value || '').trim();
                    if (!name) { toast('请填写计划名称', true); return; }
                    const k = $('#p-kind').value;
                    const unit = $('#p-unit') ? $('#p-unit').value.trim() : '';
                    const entries = draft.map(en => ({
                        id: en.id, name: (en.name || '').trim(),
                        freqDays: k === 'frequency' ? (Number(en.freqDays) || 1) : null,
                        lastCheckinDate: en.lastCheckinDate || null,
                    })).filter(en => en.name);
                    if (!entries.length) { toast('请至少添加一个' + (k === 'number' ? '成员' : '任务'), true); return; }
                    const obj = {
                        id: base.id || uid(),
                        name, icon: pickedIcon, color: pickedColor, kind: k, unit, entries,
                        createdAt: base.createdAt || Date.now(),
                        updatedAt: Date.now(),
                    };
                    await idbPut('plans', obj);
                    const valid = new Set(entries.map(en => en.id));
                    for (const l of state.logs.filter(l => l.planId === obj.id && !valid.has(l.entryId))) await idbDel('logs', l.id);
                    await loadAll();
                    closeModal();
                    renderNav(); renderContent(false);
                    toast('已保存');
                };
                if (!isNew) {
                    $('#p-del').onclick = async () => {
                        if (!confirm('删除这个计划？所有打卡记录也会一起删除。')) return;
                        for (const l of state.logs.filter(l => l.planId === base.id)) await idbDel('logs', l.id);
                        await idbDel('plans', base.id);
                        await loadAll(); closeModal(); renderNav(); renderContent(false);
                        toast('已删除');
                    };
                }
            }

            function renderEditor() {
                openModal(`<h3>${isNew ? '新建计划' : '编辑计划'}</h3>
                          <label>计划名称<input type="text" id="p-name" value="${esc(base.name || '')}" placeholder="比如：减肥计划 / 喂鱼计划"></label>
                                               <label>类型
                            <select id="p-kind">
                              <option value="check" ${kind === 'check' ? 'selected' : ''}>打卡型（每天打勾）</option>
                              <option value="number" ${kind === 'number' ? 'selected' : ''}>数值型（记录数字，如体重）</option>
                              <option value="frequency" ${kind === 'frequency' ? 'selected' : ''}>周期型（按天间隔提醒）</option>
                              <option value="record" ${kind === 'record' ? 'selected' : ''}>记录型（仅记录打卡，不提醒、不标红）</option>
                            </select>

        /* =====================================================
           图表绘制
        ===================================================== */
        function drawChart(canvas, logs) {
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1; const w = canvas.clientWidth || 500; const h = canvas.clientHeight || 180;
            canvas.width = w * dpr; canvas.height = h * dpr; const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
            const byDate = new Map(); logs.forEach(l => byDate.set(l.date, Number(l.value))); const pts = [...byDate.entries()].sort((a, b) => a[0].localeCompare(b[0]));
            if (pts.length === 0) { ctx.fillStyle = '#9CA3AF'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('还没有数据', w / 2, h / 2); return; }
            const vals = pts.map(p => p[1]); let min = Math.min(...vals), max = Math.max(...vals); if (min === max) { min -= 1; max += 1; }
            const padL = 48, padR = 12, padT = 14, padB = 24; const cw = w - padL - padR, ch = h - padT - padB;
            const xs = i => padL + (pts.length === 1 ? cw / 2 : cw * i / (pts.length - 1)); const ys = v => padT + ch - ch * ((v - min) / (max - min));
            ctx.strokeStyle = '#E5E7EB'; ctx.lineWidth = 1; ctx.fillStyle = '#9CA3AF'; ctx.font = '10.5px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4; const y = ys(v); ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke(); ctx.fillText(v.toFixed(1), padL - 8, y); }
            const grad = ctx.createLinearGradient(0, padT, 0, padT + ch); grad.addColorStop(0, 'rgba(139,92,246,.25)'); grad.addColorStop(1, 'rgba(139,92,246,0)');
            ctx.beginPath(); pts.forEach((p, i) => { i ? ctx.lineTo(xs(i), ys(p[1])) : ctx.moveTo(xs(i), ys(p[1])); }); ctx.lineTo(xs(pts.length - 1), padT + ch); ctx.lineTo(xs(0), padT + ch); ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
            ctx.beginPath(); pts.forEach((p, i) => { i ? ctx.lineTo(xs(i), ys(p[1])) : ctx.moveTo(xs(i), ys(p[1])); }); ctx.strokeStyle = '#8B5CF6'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
            pts.forEach((p, i) => { ctx.beginPath(); ctx.arc(xs(i), ys(p[1]), 3, 0, Math.PI * 2); ctx.fillStyle = '#8B5CF6'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); });
            ctx.fillStyle = '#9CA3AF'; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillText(pts[0][0].slice(5), padL, h - 16);
            if (pts.length > 1) { ctx.textAlign = 'right'; ctx.fillText(pts[pts.length - 1][0].slice(5), w - padR, h - 16); }
        }

        async function exportAll() {

            const bgSetting = await idbGet('settings', 'bgImage');
            const typesSetting = await idbGet('settings', 'customTypes');

            showProgress('正在打包数据…', 0);
            const out = {
                app: 'myVault', version: 7, exportedAt: new Date().toISOString(), items: [], plans, logs,
                bgImage: bgSetting ? bgSetting.value : null,
                customTypes: typesSetting ? typesSetting.value : [],
                categoryOrder: orderSetting ? orderSetting.value : null,
                categoryMeta: metaSetting ? metaSetting.value : null,
            };
            for (let i = 0; i < items.length; i++) { const it = { ...items[i] }; if (it.blob instanceof Blob) { it.blobData = await blobToDataURL(it.blob); delete it.blob; } out.items.push(it); if (i % 5 === 0) { setProgress(i / items.length); await new Promise(r => setTimeout(r, 0)); } }
            setProgress(1); const json = JSON.stringify(out); const d = new Date();
            const name = `收藏库备份_${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}.json`;

        async function importAll(file, merge = true) {
            const text = await file.text(); let data;
            try { data = JSON.parse(text); } catch (e) { toast('文件格式不对', true); return; }
            if (!data || !Array.isArray(data.items)) { toast('这不是有效的备份文件', true); return; }
            if (!merge) { if (!confirm('将清空现有全部数据，用备份覆盖。确定吗？')) return; await idbClear('items'); await idbClear('plans'); await idbClear('logs'); await idbClear('settings'); }
            showProgress('正在导入…', 0);
            for (let i = 0; i < data.items.length; i++) { const it = { ...data.items[i] }; if (it.blobData) { try { it.blob = dataURLToBlob(it.blobData); } catch (e) { } delete it.blobData; } await idbPut('items', it); if (i % 5 === 0) { setProgress(i / Math.max(1, data.items.length)); await new Promise(r => setTimeout(r, 0)); } }
            for (const p of (data.plans || [])) await idbPut('plans', p);
            for (const l of (data.logs || [])) await idbPut('logs', l);
            if (data.bgImage) { await idbPut('settings', { key: 'bgImage', value: data.bgImage }); }
            if (data.customTypes) { await idbPut('settings', { key: 'customTypes', value: data.customTypes }); }
            if (data.categoryOrder) { await idbPut('settings', { key: 'categoryOrder', value: data.categoryOrder }); }
            if (data.categoryMeta) { await idbPut('settings', { key: 'categoryMeta', value: data.categoryMeta }); }
            setProgress(1); state.urlCache.forEach(u => URL.revokeObjectURL(u)); state.urlCache.clear();
            await loadAll(); await loadBgImage(); await loadCustomTypes(); await loadCategoryOrder(); await loadCategoryMeta();
            hideProgress(); renderNav(); renderContent(); toast('导入完成');
        }

            inp.style.display = 'none';
            inp.onchange = async () => {
                const files = inp.files;
                inp.remove();
                if (files && files.length) await callback(files);
            };
            document.body.appendChild(inp);
            inp.click();
        }

        async function addImages(files, typeForSave = 'image') {
            const list = [...files]; if (!list.length) return;
            showProgress(`处理中 0/${list.length}`, 0); let ok = 0, fail = 0;
            for (let i = 0; i < list.length; i++) {
                const f = list[i];
                try {
                    let thumb;
                    if (f.type.startsWith('video/')) thumb = await grabVideoFrame(f);
                    else if (f.type.startsWith('image/')) thumb = await compressImage(f);
                    else { fail++; continue; }
                    const item = {
                        id: uid(), type: typeForSave, title: f.name.replace(/\.[^.]+$/, ''),
                        blob: thumb.blob, w: thumb.w, h: thumb.h,
                        isVideo: f.type.startsWith('video/'),
                        note: '', source: '',
                        parentId: state.currentFolderId || null,
                        createdAt: Date.now(), updatedAt: Date.now(),
                    };
                    await idbPut('items', item); ok++;
                } catch (e) { console.error(e); fail++; }
                setProgress((i + 1) / list.length); $('#progText').textContent = `处理中 ${i + 1}/${list.length}`; await new Promise(r => setTimeout(r, 0));
            }
            await loadAll(); hideProgress(); renderNav(); renderContent();
            toast(`完成：成功 ${ok} 个${fail ? '，失败 ' + fail + ' 个' : ''}`);
        }

        function bindUI() {
            $('#nav').addEventListener('click', e => {
                // 计划按钮优先判断（计划按钮只有 data-plan-id，没有 data-view）
                const planBtn = e.target.closest('button[data-plan-id]');
                if (planBtn) {
                    state.view = 'plan';

                    state.currentFolderId = null;
                    state.folderPath = [];
                    state.expandedFolders.clear();
                    renderNav(); renderContent(true);
                    $('#content').scrollTop = 0;
                    return;
                }
                const btn = e.target.closest('button[data-view]');
                if (!btn) return;
                const newView = btn.dataset.view;
                if (state.view === newView && !state.currentFolderId) {
                    if (newView === 'plan') { state.currentPlanId = null; renderNav(); renderContent(true); }
                    return;
                }
                state.view = newView;
                state.currentFolderId = null;
                state.folderPath = [];
                state.expandedFolders.clear();
                if (newView !== 'plan') state.currentPlanId = null;
                renderNav(); renderContent(true);
                $('#content').scrollTop = 0;
            });

            let searchTimer;
            $('#search').addEventListener('input', e => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => { state.search = e.target.value; renderContent(false); }, 160);
            });

            $('#btnAdd').onclick = handleAdd;
            $('#btnNewFolder').onclick = openNewFolderDialog;

            $('#content').addEventListener('click', e => {
                /* ---------- 日历日期点击：展开当日详情 ---------- */
                const calCell = e.target.closest('.cal-cell[data-date]');
                if (calCell && !calCell.classList.contains('empty')) {
                    const ds = calCell.dataset.date;
                    selectedCalDate = (selectedCalDate === ds) ? null : ds;
                    const sc = $('#content').scrollTop;
                    renderContent(false);
                    $('#content').scrollTop = sc;
                    return;
                }
                /* ---------- 0. 计划卡片内部操作 ---------- */
                const planEl = e.target.closest('.plan-card [data-act]');
                if (planEl) {
                    const act = planEl.dataset.act;
                    const planId = planEl.dataset.plan;
                    const entryId = planEl.dataset.entry;
                    try {
                        if (act === 'plan-edit') { e.stopPropagation(); const p = state.plans.find(x => x.id === planId); if (p) openPlanEditor(p); return; }
                        if (act === 'check') { e.stopPropagation(); doCheckIn(planId, entryId); return; }
                        if (act === 'uncheck') { e.stopPropagation(); doUncheck(planId, entryId); return; }
                        if (act === 'entry-history') { e.stopPropagation(); openEntryHistory(planId, entryId); return; }
                    } catch (err) { console.error('计划卡片操作出错:', err); toast('操作失败：' + (err.message || err), true); return; }
                }

                // 提醒区的跳转
                const gotoBtn = e.target.closest('[data-goto-plan]');
                if (gotoBtn) {
                    e.stopPropagation();
                    const planId = gotoBtn.dataset.gotoPlan;
                    const p = state.plans.find(x => x.id === planId);
                    if (p) { state.view = 'plan'; state.currentPlanId = planId; renderNav(); renderContent(true); }
                    return;
                }

                // 1. 编辑按钮
                const editBtn = e.target.closest('[data-act="edit"]');
                if (editBtn) {
                    e.stopPropagation();
                    const it = state.items.find(x => x.id === editBtn.dataset.id);
                    if (it) openItemEditor(it.type, it);
                    return;
                }

                // 2. 进入类别
                const enterBtn = e.target.closest('[data-act="enter-folder"]');
                if (enterBtn) {
                    e.stopPropagation();
                    const it = state.items.find(x => x.id === enterBtn.dataset.id);
                    if (it) {
                        state.currentFolderId = it.id;
                        state.folderPath.push({ id: it.id, title: it.title || '未命名类别' });

                        renderContent(true);
                        $('#content').scrollTop = 0;
                    }
                    return;
                }

                // 3. 大类别入口
                const catEntry = e.target.closest('.cat-entry');
                if (catEntry) {
                    const cat = catEntry.dataset.cat;
                    state.view = cat;
                    state.currentFolderId = null;
                    state.folderPath = [];
                    state.expandedFolders.clear();
                    renderNav(); renderContent(true);
                    $('#content').scrollTop = 0;
                    return;

                // 4. 普通卡片
                const card = e.target.closest('.card, .mini-card'); if (!card) return;
                const id = card.dataset.id; const act = card.dataset.act;
                const it = state.items.find(x => x.id === id); if (!it) return;

                    if (state.expandedFolders.has(id)) state.expandedFolders.delete(id);

                    entries: [
                        { id: uid(), name: '每天喂鱼', freqDays: 1, lastCheckinDate: null },
                        { id: uid(), name: '定期换水', freqDays: 7, lastCheckinDate: null },
                        { id: uid(), name: '过滤器清理', freqDays: 14, lastCheckinDate: null },
                    ],
                    createdAt: now, updatedAt: now,
                });
                await loadAll();
            }
            await idbPut('settings', { key: 'planDefaultsSeeded_v2', value: true });
        }

        /* =====================================================
           启动
           v6：优先从磁盘恢复；从磁盘恢复时把数据镜像回 IndexedDB
        ===================================================== */
        (async function init() {
            bindUI();
            updateClock();
            setInterval(updateClock, 1000);
            try { await openDB(); } catch (e) { console.error('数据库打开失败:', e); toast('数据库打开失败：' + (e.message || e), true); return; }

            console.log('[myVault] IS_TAURI =', IS_TAURI, '| origin =', location.origin);

            // 1) 优先尝试从磁盘（Tauri AppData/vault-data.json）恢复
            let diskData = null;
            try { diskData = await loadFromDisk(); } catch (e) { console.error('loadFromDisk 异常:', e); }

            if (diskData) {
                // 用磁盘数据填充内存状态
                state.items = deserializeItemsFromDisk(diskData.items);
                state.items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
                state.plans = diskData.plans || [];
                state.logs = diskData.logs || [];
                state.customTypes = Array.isArray(diskData.customTypes) ? diskData.customTypes : [];
                state.categoryOrder = diskData.categoryOrder || null;
                state.categoryMeta = diskData.categoryMeta ? { ...DEFAULT_CATEGORY_META, ...diskData.categoryMeta } : { ...DEFAULT_CATEGORY_META };
                if (diskData.bgImage) state.bgImage = diskData.bgImage;

                console.log('[myVault] 从磁盘恢复：', state.items.length, 'items /', state.plans.length, 'plans /', state.logs.length, 'logs');

                // 2) 把磁盘数据镜像回 IndexedDB，保持两边一致，
                //    这样后续 loadAll() 从 IDB 读到的就是完整数据
                try {
                    await idbClear('items');
                    await idbClear('plans');
                    await idbClear('logs');
                    for (const it of state.items) await idbPut('items', it);
                    for (const p of state.plans) await idbPut('plans', p);
                    for (const l of state.logs) await idbPut('logs', l);
                    await idbPut('settings', { key: 'bgImage', value: state.bgImage || '' });
                    await idbPut('settings', { key: 'customTypes', value: state.customTypes });
                    if (state.categoryOrder) await idbPut('settings', { key: 'categoryOrder', value: state.categoryOrder });
                    await idbPut('settings', { key: 'categoryMeta', value: state.categoryMeta });
                    console.log('[myVault] 磁盘数据已镜像回 IndexedDB');
                } catch (e) {
                    console.error('镜像回 IndexedDB 失败:', e);
                }

                if (state.bgImage) applyBgImage(state.bgImage);
            } else {
                // 磁盘没有数据：走原来的 IndexedDB 加载流程
                try { await loadAll(); } catch (e) { console.error('数据加载失败:', e); }
                try { await ensureDefaultPlans(); } catch (e) { console.error('默认计划初始化失败:', e); }
                try { await loadBgImage(); } catch (e) { console.error('背景加载失败:', e); }
                try { await loadCustomTypes(); } catch (e) { console.error('分类加载失败:', e); }
                try { await loadCategoryOrder(); } catch (e) { console.error('顺序加载失败:', e); }
                try { await loadCategoryMeta(); } catch (e) { console.error('分类元信息加载失败:', e); }
            }

            // 3) 启用持久化：此后所有 loadAll() 都会自动写盘
            state.persistEnabled = true;
            // 主动写盘一次，确保磁盘文件与当前状态一致
            try { await saveToDisk(); } catch (e) { console.error('启动写盘失败:', e); }

            renderNav(); renderContent(false);
        })();
    </script>
</body>
</html>
