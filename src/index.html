<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <!--
    ================================================================
      我的收藏库 · 改动日志
      纯前端单文件应用
      桌面端数据存 JSON 文件（Tauri AppData）
      浏览器端数据存 IndexedDB（数据库名 myVault，版本 2）
      对象仓库：items（收藏）/ plans（计划）/ logs（打卡记录）/ settings（设置）
      警告：不要移动或重命名这个 HTML 文件，否则 IndexedDB 会重新初始化
    ================================================================

    【v1 · 基础版】
    - 收藏分类：图片 / 网站 / 动漫 三个内置分类 + 自定义分类
    - 分类可拖拽排序，支持多级文件夹
    - 计划模块：打卡型、数值型、周期型
    - 左侧导航、顶部大日历、待打卡提醒
    - 默认预置「减肥计划」（数值型）和「喂鱼计划」（周期型）
    - 支持导入 / 导出 JSON 备份，支持更换背景图

    【v2 · 交互优化】
    - 顶栏：「＋ 添加」按钮移到搜索框右侧；日期时间固定在右上角
    - 左侧「我的计划」下每个计划可直接点击进入详情页
    - 大日历改造：
      · 每一天可点击，展开当日打卡详情（已打卡的计划+数值+未打卡计划列表）
      · 格子内显示各计划颜色小圆点（彩色=已打卡，灰色=未打卡）
      · 图例：有打卡 / 未打卡 / 今天
    - 日历日期点击逻辑挂在 #content 的 click 事件里（closest('.cal-cell[data-date]')）

    【v3 · 计划增强】
    - 计划卡片新增「创建日期」显示（副标题形式，格式 MM-DD）
    - 日历里「计划创建日期之前」的日期不再标红为未打卡
      · 判定逻辑：plans.some(p => 创建日 <= 该日期)
    - 周期任务的「每多少天」数字框改为下拉选择器
      · 预设：每天 / 每2天 / 每3天 / 每5天 / 每周 / 每两周 / 每月 / 每季度 / 每半年
      · 老数据里不常见的天数会自动追加一个选项并保持选中
    - 周期任务名右侧显示「上次: MM-DD · 还有 N 天」
      · 逾期变红、今天到期变黄、未来紫色

    【v4 · Bug 修复】
    - 修复严重 bug：addDays 函数的参数名 dateStr 遮蔽了同名工具函数 dateStr()
      · 触发条件：周期任务已打卡（lastCheckinDate 有值）→ renderReminders 调 addDays → 抛 TypeError → 整个 renderPlans 渲染中断
      · 症状：全部计划页卡死在上次渲染结果、打卡无反应、点击左侧计划无反应
      · 修复：参数改名 isoStr
    - 防御性加固：renderContent 里 renderPlans / renderCategoryEntries 加 try/catch
    - 计划卡片内部操作（打卡/编辑/历史）加 try/catch + toast 错误提示

    【v5 · 图标与计划类型】
    - ICON_LIB 扩充图标：swim（游泳）、weight（体重管理秤）、fish（喂鱼）、
      droplet（水滴）、run（跑步）、dumbbell（哑铃）、apple（苹果）、
      moon（月亮）、sun（太阳）、coffee（咖啡）、pill（药丸）、smile（笑脸）
    - 新增 ICON_COMMON 常用图标数组（star/heart/flag/calendar/bookmark/
      weight/swim/fish/dumbbell/droplet 共 10 个）
    - 图标选择器改为「常用 + 更多」两段式
      · 默认显示 10 个常用图标
      · 点「＋ 更多图标」展开全部，再点「− 收起更多」收起
      · 收藏分类编辑器和计划编辑器两处都生效
    - 计划类型新增「记录型（record）」
      · 可正常打卡、取消打卡，打卡后日历仍显示 has-log 和彩色圆点
      · 但：日历不标红（不参与 missed 判定）
      · 但：不进入「待打卡提醒」
      · 但：当日详情里不计入未打卡列表，dd-sum 分母也排除

    【v6 · 桌面端持久化（Tauri 方案 B）】
    - 背景：打包成 Windows 桌面应用后，PakePlus 每次启动可能给 WebView
      分配不同的 origin（本地端口随机 / 数据目录变化），IndexedDB 因
      为绑定 origin 而"看起来"丢了数据。
    - 方案：优先把全部数据以 JSON 文件写到系统 AppData 目录。
      · 文件路径：Tauri BaseDirectory.AppData / vault-data.json
        Windows 实际位置：%APPDATA%\<应用标识符>\vault-data.json
      · 图片 / 封面（Blob）序列化为 base64 DataURL 后一起存
    - 加载优先级：磁盘 JSON > IndexedDB > 默认计划
    - 所有数据变更（打卡 / 取消 / 编辑 / 删除 / 导入 / 背景）自动写盘
      · 具体做法：loadAll() 末尾自动调用 saveToDisk()
    - 从磁盘恢复后，会把数据镜像回 IndexedDB，保持两边一致
    - 环境判断：非 Tauri 环境（直接浏览器打开）自动降级为纯 IndexedDB
    - 需要的前提条件：
      · PakePlus 中开启「TauriApi」开关
      · src-tauri/capabilities/default.json 授予 fs 权限：
          "fs:allow-app-read",
          "fs:allow-app-write",
          "fs:scope-app"
    - 注意：Blob 会在每次保存时完整序列化，数据量很大时保存耗时会增加

    ================================================================
    【关键数据结构备忘】

    plan 对象：
      { id, name, icon, color, kind, unit, entries[], createdAt, updatedAt }
      kind 取值：'check'（打卡）| 'number'（数值）| 'frequency'（周期）| 'record'（记录）

    entry（计划子项）：
      { id, name, freqDays?, lastCheckinDate? }
      · freqDays 仅周期型有值（数字，单位：天）
      · lastCheckinDate 是 ISO 日期字符串 'YYYY-MM-DD'，由 doCheckIn 自动维护

    log 对象：
      { id, planId, entryId, date: 'YYYY-MM-DD', value: number }

    【关键函数位置速查】
      renderCalendar()      — 大日历渲染（含计划色点、未打卡标红）
      renderDayDetail(ds)   — 某一天的打卡详情
      renderPlans(c)        — 计划模块总入口
      planCardHTML(p, ...)  — 单张计划卡片
      doCheckIn / doUncheck — 打卡 / 取消打卡
      openPlanEditor(plan)  — 计划编辑器（新建/编辑）
      openTypeEditor(type)  — 分类编辑器
      ensureDefaultPlans()  — 首次运行植入默认计划
      saveToDisk()          — v6 新增：把全部数据写入磁盘 JSON
      loadFromDisk()        — v6 新增：从磁盘 JSON 恢复全部数据
      loadAll()             — 已改：末尾自动写盘

    【已知注意事项】
    - addDays(isoStr, days) 参数名不能叫 dateStr，会遮蔽同名工具函数
    - 图标选择器的外层容器不能用 <label>，否则里面的 <button> 会被
      label 隐式关联，点任何地方都会触发 button 点击
    - IndexedDB 版本号 DB_VER = 2，如需加新对象仓库要升级版本号
    - v6 持久化依赖 PakePlus 的「TauriApi」开关和 capabilities fs 权限
    ================================================================
    -->
    <title>我的收藏库</title>
    <style>
        :root {
            --bg: #F4F6F9;
            --panel: #FFFFFF;
            --card: #FFFFFF;
            --border: #E5E7EB;
            --text: #1F2937;
            --dim: #6B7280;
            --accent: #4F6BFF;
            --accent-light: #EEF2FF;
            --accent-plan: #8B5CF6;
            --accent-plan-light: #F3EEFF;
            --danger: #EF4444;
            --ok: #10B981;
            --shadow: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html, body {
            height: 100%
        }

        body {
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
            background-color: var(--bg);
            color: var(--text);
            font-size: 14px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        #app {
            display: flex;
            height: 100vh
        }

        #sidebar {
            width: 248px;
            flex: none;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px 16px;
            gap: 14px;
            overflow: hidden;
            height: 100vh;
        }

        .brand {
            font-size: 16px;
            font-weight: 700;
            padding: 0 8px;
            color: var(--text);
        }

            .brand small {
                display: block;
                font-size: 11px;
                color: var(--dim);
                font-weight: 400;
                margin-top: 4px;
            }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            min-height: 0;
            overflow: hidden
        }

        .nav-primary {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 14px;
            border-bottom: 1px dashed var(--border);
            margin-bottom: 12px;
            flex: none;
        }

        .nav-sec-title {
            font-size: 10.5px;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1.4px;
            padding: 2px 10px 8px;
            font-weight: 600;
            flex: none;
        }

        .nav-secondary {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            min-height: 0
        }

            .nav-secondary::-webkit-scrollbar {
                width: 4px
            }

            .nav-secondary::-webkit-scrollbar-thumb {
                background: #D1D5DB;
                border-radius: 2px
            }

        .nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 12px;
            border: 0;
            background: transparent;
            color: var(--dim);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-family: inherit;
            text-align: left;
            transition: background 0.2s, color 0.2s;
            position: relative;
            flex-shrink: 0;
        }

            .nav button:hover {
                background: #F3F4F6;
                color: var(--text)
            }

            .nav button.active {
                background: var(--accent-light);
                color: var(--accent);
                font-weight: 600
            }

            .nav button svg {
                width: 18px;
                height: 18px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex-shrink: 0;
                pointer-events: none;
            }

            .nav button .label {
                pointer-events: none;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis
            }

            .nav button .count {
                margin-left: auto;
                font-size: 11.5px;
                opacity: 0.7;
                pointer-events: none;
                min-width: 16px;
                text-align: right
            }

        .nav-primary button[data-view="all"] svg {
            stroke: #4F6BFF
        }

        .nav-primary button[data-view="all"].active {
            background: #EEF2FF;
            color: #4F6BFF
        }

        .nav-primary button[data-view="plan"] svg {
            stroke: #8B5CF6
        }

        .nav-primary button[data-view="plan"].active {
            background: #F3EEFF;
            color: #8B5CF6
        }

        .nav button.dragging {
            opacity: 0.3
        }

        .nav button.drop-before {
            box-shadow: inset 0 3px 0 -1px var(--accent)
        }

        .nav button.drop-after {
            box-shadow: inset 0 -3px 0 -1px var(--accent)
        }

        .side-foot {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: none;
            margin-top: auto
        }

            .side-foot button {
                padding: 10px 14px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: #fff;
                color: var(--dim);
                cursor: pointer;
                font-size: 13px;
                font-family: inherit;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 10px;
            }

                .side-foot button:hover {
                    background: #F9FAFB;
                    color: var(--text);
                    border-color: #D1D5DB
                }

        .tip {
            font-size: 11px;
            color: #9CA3AF;
            line-height: 1.6;
            padding: 0 4px;
            flex: none
        }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: transparent
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 16px 24px 14px;
            border-bottom: 1px solid var(--border);
            flex: none;
            background: var(--panel);
        }

        #search {
            flex: 1;
            max-width: 480px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #F9FAFB;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }

            #search:focus {
                border-color: var(--accent);
                background: #fff;
                box-shadow: 0 0 0 3px rgba(79,107,255,0.1)
            }

        #datetime {
            margin-left: auto;
            font-size: 13px;
            color: var(--dim);
            font-weight: 500;
            white-space: nowrap;
            background: #F9FAFB;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: 0;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
        }

            .btn:hover {
                background: #3B5BDB;
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(79,107,255,0.3)
            }

            .btn.ghost {
                background: #F3F4F6;
                color: var(--dim);
                border: 1px solid transparent
            }

                .btn.ghost:hover {
                    background: #E5E7EB;
                    color: var(--text);
                    transform: translateY(-1px);
                    box-shadow: var(--shadow)
                }

            .btn.danger {
                background: transparent;
                color: var(--danger);
                border: 1px solid #FEE2E2
            }

                .btn.danger:hover {
                    background: #FEF2F2;
                    color: #DC2626
                }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            border-bottom: 1px solid var(--border);
            flex: none;
            background: var(--panel);
            min-height: 48px;
        }

        #breadcrumb {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13.5px;
            color: var(--dim);
        }

            #breadcrumb .crumb {
                cursor: pointer;
                padding: 3px 8px;
                border-radius: 6px;
                transition: all 0.15s;
            }

                #breadcrumb .crumb:hover {
                    background: #F3F4F6;
                    color: var(--text)
                }

                #breadcrumb .crumb.current {
                    color: var(--text);
                    font-weight: 600;
                    cursor: default;
                }

                    #breadcrumb .crumb.current:hover {
                        background: transparent
                    }

            #breadcrumb .sep {
                color: #D1D5DB;
                user-select: none
            }

            #breadcrumb .crumb-icon {
                width: 16px;
                height: 16px;
                display: inline-flex;
                vertical-align: -3px;
                margin-right: 4px;
            }

                #breadcrumb .crumb-icon svg {
                    width: 16px;
                    height: 16px;
                    stroke: currentColor;
                    fill: none;
                    stroke-width: 2;
                    stroke-linecap: round;
                    stroke-linejoin: round;
                }

        #btnNewFolder {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            font-size: 13px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--dim);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            white-space: nowrap;
        }

            #btnNewFolder:hover {
                background: #F9FAFB;
                color: var(--text);
                border-color: #D1D5DB
            }

            #btnNewFolder svg {
                width: 15px;
                height: 15px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px
        }

            #content::-webkit-scrollbar {
                width: 8px
            }

            #content::-webkit-scrollbar-thumb {
                background: #D1D5DB;
                border-radius: 4px
            }

        /* ===== 全部收藏：大类别入口 ===== */
        .cat-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            max-width: 100%;
        }

        .cat-entry {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow);
            animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

            .cat-entry:hover {
                border-color: #D1D5DB;
                transform: translateY(-1px);
                box-shadow: var(--shadow-hover);
            }

            .cat-entry .cat-icon-box {
                width: 46px;
                height: 46px;
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex: none;
                transition: transform 0.2s;
            }

            .cat-entry:hover .cat-icon-box {
                transform: scale(1.06);
            }

            .cat-entry .cat-icon-box svg {
                width: 24px;
                height: 24px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .cat-entry .cat-info {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .cat-entry .cat-name {
                font-size: 15px;
                font-weight: 600;
                color: var(--text);
                line-height: 1.3;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .cat-entry .cat-sub {
                font-size: 12px;
                color: #9CA3AF;
            }

            .cat-entry .cat-arrow {
                flex: none;
                color: #D1D5DB;
                display: flex;
                align-items: center;
                transition: color 0.2s, transform 0.2s;
            }

            .cat-entry:hover .cat-arrow {
                color: var(--accent);
                transform: translateX(2px);
            }

            .cat-entry .cat-arrow svg {
                width: 18px;
                height: 18px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

        /* ===== 分类内：小正方形卡片 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
            gap: 16px
        }

        /* 文件夹长条 */
        .folder-block {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: cardIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card.folder {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            min-height: 0;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

            .card.folder:hover {
                border-color: #D1D5DB;
                transform: translateY(-1px);
                box-shadow: var(--shadow-hover);
            }

            .card.folder .folder-icon-box {
                width: 40px;
                height: 40px;
                flex: 0 0 40px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: transform 0.2s;
            }

            .card.folder:hover .folder-icon-box {
                transform: scale(1.05);
            }

            .card.folder .folder-icon-box svg {
                width: 22px;
                height: 22px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .card.folder .folder-info {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

        #modalRoot {

            inset: 0;
            z-index: 100
        }

            inset: 0;

            justify-content: center;

        function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function dateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function fmtDate(ts) { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
        function addDays(isoStr, days) { const d = new Date(isoStr + 'T00:00:00'); d.setDate(d.getDate() + days); return dateStr(d); }
        let toastTimer;
        function toast(msg, isErr) { const el = $('#toast'); el.textContent = msg; el.className = isErr ? 'show err' : 'show'; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = '', 2400); }
        function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
        function blobToDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
        function dataURLToBlob(d) { const [meta, b64] = d.split(','); const mime = (meta.match(/:(.*?);/) || [, 'image/jpeg'])[1]; const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }

        /* =====================================================
           v6 · Tauri 文件持久化（方案 B）
           桌面端：数据以 JSON 文件写到 AppData 目录
           浏览器端：自动降级为纯 IndexedDB
        ===================================================== */
        const IS_TAURI = typeof window !== 'undefined' && !!window.__TAURI__ && !!window.__TAURI__.fs;
        const fsApi = IS_TAURI ? window.__TAURI__.fs : {};
        const APP_DATA_DIR = (fsApi.BaseDirectory && fsApi.BaseDirectory.AppData) || 'AppData';
        const DATA_FILE = 'vault-data.json';

        // items 里的 blob 无法 JSON 序列化，保存前转 base64，加载时转回 Blob
        async function serializeItemsForDisk(items) {
            const out = [];
            for (const it of items) {
                const copy = { ...it };
                if (copy.blob instanceof Blob) {
                    try { copy.blobData = await blobToDataURL(copy.blob); } catch (e) { /* skip */ }
                    delete copy.blob;
                }
                out.push(copy);
            }
            return out;
        }
        function deserializeItemsFromDisk(items) {
            return (items || []).map(it => {
                const copy = { ...it };
                if (copy.blobData) {
                    try { copy.blob = dataURLToBlob(copy.blobData); } catch (e) { /* skip */ }
                    delete copy.blobData;
                }
                return copy;
            });
        }

        async function saveToDisk() {
            if (!IS_TAURI) return;
            try {
                const payload = {
                    app: 'myVault',
                    diskVersion: 1,
                    savedAt: new Date().toISOString(),
                    items: await serializeItemsForDisk(state.items),
                    plans: state.plans,

                    bgImage: state.bgImage || null,
                    customTypes: state.customTypes || [],
                    categoryOrder: state.categoryOrder || null,
                    categoryMeta: state.categoryMeta || null,
                };
                await fsApi.writeTextFile(DATA_FILE, JSON.stringify(payload), { dir: APP_DATA_DIR });
                console.log('[myVault] 已写盘:', DATA_FILE);
            } catch (e) {
                console.error('saveToDisk 失败:', e);
            }
        }

        async function loadFromDisk() {
            if (!IS_TAURI) return null;
            try {
                const ok = await fsApi.exists(DATA_FILE, { dir: APP_DATA_DIR });
                if (!ok) return null;
                const text = await fsApi.readTextFile(DATA_FILE, { dir: APP_DATA_DIR });
                const data = JSON.parse(text);
                if (!data || !Array.isArray(data.items)) return null;
                return data;
            } catch (e) {
                console.error('loadFromDisk 失败:', e);
                return null;
            }

        /* =====================================================
           IndexedDB
        ===================================================== */
        const DB_NAME = 'myVault';
        const DB_VER = 2;
        let db = null;
        function openDB() {
            return new Promise((res, rej) => {
                let finished = false;
                const timer = setTimeout(() => { if (finished) return; finished = true; rej(new Error('数据库打开超时，请关闭所有打开过此应用的页面后再试。')); }, 8000);
                const req = indexedDB.open(DB_NAME, DB_VER);
                req.onupgradeneeded = e => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains('items')) { const s = d.createObjectStore('items', { keyPath: 'id' }); s.createIndex('type', 'type'); s.createIndex('updatedAt', 'updatedAt'); }
                    if (!d.objectStoreNames.contains('plans')) { d.createObjectStore('plans', { keyPath: 'id' }); }
                    if (!d.objectStoreNames.contains('logs')) { const s = d.createObjectStore('logs', { keyPath: 'id' }); s.createIndex('planId', 'planId'); }
                    if (!d.objectStoreNames.contains('settings')) { d.createObjectStore('settings', { keyPath: 'key' }); }
                };
                req.onsuccess = e => { if (finished) return; finished = true; clearTimeout(timer); db = e.target.result; res(db); };
                req.onerror = e => { if (finished) return; finished = true; clearTimeout(timer); rej(e.target.error); };
                req.onblocked = () => { if (finished) return; finished = true; clearTimeout(timer); rej(new Error('数据库被其他窗口占用。')); };
            });
        }
        function store(name, mode = 'readonly') { return db.transaction(name, mode).objectStore(name); }
        function idbGetAll(name) { return new Promise((res, rej) => { const r = store(name).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
        function idbPut(name, val) { return new Promise((res, rej) => { const r = store(name, 'readwrite').put(val); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
        function idbGet(name, key) { return new Promise((res, rej) => { const r = store(name).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
        function idbDel(name, key) { return new Promise((res, rej) => { const r = store(name, 'readwrite').delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
        function idbClear(name) { return new Promise((res, rej) => { const r = store(name, 'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

        async function loadBgImage() {
            const setting = await idbGet('settings', 'bgImage');
            if (setting && setting.value) { state.bgImage = setting.value; applyBgImage(setting.value); }
        }
        function applyBgImage(dataUrl) { document.body.classList.add('has-bg'); document.body.style.backgroundImage = `url(${dataUrl})`; }
        function removeBgImage() { document.body.classList.remove('has-bg'); document.body.style.backgroundImage = 'none'; }
        async function handleBgUpload(file) {
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) {
                try { showProgress('正在压缩背景图…', 0); const { blob } = await compressImage(file, 1920, 0.85); const dataUrl = await blobToDataURL(blob); setProgress(1); hideProgress(); await saveBg(dataUrl); }
                catch (e) { hideProgress(); toast('背景图处理失败', true); }
            } else { const dataUrl = await blobToDataURL(file); await saveBg(dataUrl); }
        }
        async function saveBg(dataUrl) {
            try {
                await idbPut('settings', { key: 'bgImage', value: dataUrl });
                state.bgImage = dataUrl;
                applyBgImage(dataUrl);
                if (state.persistEnabled) await saveToDisk();
                toast('背景已更新');
            }
            catch (e) { toast('背景保存失败，可能图片太大', true); }
        }

        async function deleteCustomType(id) {
            const t = state.customTypes.find(x => x.id === id); if (!t) return;
            const related = state.items.filter(i => i.type === id);
            let msg = `确定删除分类「${t.name}」吗？`;

            if (!confirm(msg)) return;
            for (const it of related) { revokeURL(it.id); await idbDel('items', it.id); }
            state.customTypes = state.customTypes.filter(x => x.id !== id);
            await saveCustomTypes();
            if (state.view === id) state.view = 'all';
            await loadAll();
            renderNav(); renderContent();
            closeModal();

        /* =====================================================
           拖拽排序
        ===================================================== */
        let dragSrcEl = null;
        function bindDragEvents() {
            const items = document.querySelectorAll('#navSecondary button[data-view]');
            items.forEach(item => {
                item.draggable = true;
                item.addEventListener('dragstart', e => { dragSrcEl = item; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', item.dataset.view); } catch (err) { } });
                item.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (item === dragSrcEl) return; const rect = item.getBoundingClientRect(); const before = e.clientY < rect.top + rect.height / 2; item.classList.toggle('drop-before', before); item.classList.toggle('drop-after', !before); });
                item.addEventListener('dragleave', () => { item.classList.remove('drop-before', 'drop-after'); });
                item.addEventListener('drop', async e => {
                    e.preventDefault();
                    if (item === dragSrcEl) { item.classList.remove('drop-before', 'drop-after'); return; }
                    const rect = item.getBoundingClientRect(); const before = e.clientY < rect.top + rect.height / 2;
                    const parent = item.parentElement;
                    if (before) parent.insertBefore(dragSrcEl, item); else parent.insertBefore(dragSrcEl, item.nextSibling);
                    item.classList.remove('drop-before', 'drop-after');
                    const newOrder = [...document.querySelectorAll('#navSecondary button[data-view]')].map(b => b.dataset.view);
                    await saveCategoryOrder(newOrder); toast('顺序已保存');
                });
                item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after')); dragSrcEl = null; });
            });
        }

        /* =====================================================
           图片压缩 / 视频截帧
        ===================================================== */
        function compressImage(file, maxSide = 900, quality = 0.82) {
            return new Promise((res, rej) => {
                const img = new Image(); const url = URL.createObjectURL(file);
                img.onload = () => {
                    let w = img.naturalWidth, h = img.naturalHeight;
                    const scale = Math.min(1, maxSide / Math.max(w, h));
                    w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
                    const c = document.createElement('canvas'); c.width = w; c.height = h;
                    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    c.toBlob(b => { URL.revokeObjectURL(url); b ? res({ blob: b, w, h }) : rej(new Error('压缩失败')); }, 'image/jpeg', quality);
                };
                img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('图片读取失败')); };
                img.src = url;
            });
        }
        function grabVideoFrame(file, maxSide = 900) {
            return new Promise((res, rej) => {
                const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; v.playsInline = true;
                const url = URL.createObjectURL(file); let done = false;
                const finish = () => {
                    if (done) return; done = true;
                    try {
                        let w = v.videoWidth, h = v.videoHeight; if (!w || !h) { URL.revokeObjectURL(url); return rej(new Error('无法读取视频尺寸')); }
                        const scale = Math.min(1, maxSide / Math.max(w, h)); w = Math.round(w * scale); h = Math.round(h * scale);
                        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h);
                        c.toBlob(b => { URL.revokeObjectURL(url); b ? res({ blob: b, w, h }) : rej(new Error('截帧失败')); }, 'image/jpeg', 0.82);
                    } catch (err) { URL.revokeObjectURL(url); rej(err); }
                };
                v.onloadeddata = () => { const t = (v.duration && isFinite(v.duration)) ? Math.min(1, v.duration / 3) : 0; if (t > 0) { try { v.currentTime = t; } catch (e) { finish(); } } else finish(); };
                v.onseeked = finish; v.onerror = () => { URL.revokeObjectURL(url); rej(new Error('视频读取失败')); };
                setTimeout(() => { if (!done) finish(); }, 6000); v.src = url;
            });
        }

        /* =====================================================
           数据加载
           v6：末尾自动写盘（桌面端）
        ===================================================== */
        async function loadAll() {
            state.items = await idbGetAll('items');
            state.plans = await idbGetAll('plans');
            state.logs = await idbGetAll('logs');
            state.items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            if (state.persistEnabled) {
                try { await saveToDisk(); } catch (e) { console.error('自动写盘失败:', e); }
            }
        }
        function getURL(item) { if (!item.blob) return ''; if (state.urlCache.has(item.id)) return state.urlCache.get(item.id); const u = URL.createObjectURL(item.blob); state.urlCache.set(item.id, u); return u; }
        function revokeURL(id) { if (state.urlCache.has(id)) { URL.revokeObjectURL(state.urlCache.get(id)); state.urlCache.delete(id); } }

        /* =====================================================
           渲染 —— 侧栏
        ===================================================== */
        function renderNav() {
            const allCount = state.items.filter(i => !i.isFolder).length;
            const planCount = state.plans.length;
            const allActive = state.view === 'all';
            const planActive = state.view === 'plan' && !state.currentPlanId;

            $('#navPrimary').innerHTML = `
                <button data-view="all" class="${allActive ? 'active' : ''}">
                  ${ICON_LIB.grid}<span class="label">全部收藏</span><span class="count">${allCount || ''}</span>
                </button>
                <button data-view="plan" class="${planActive ? 'active' : ''}">
                  ${ICON_LIB.calendar}<span class="label">全部计划</span><span class="count">${planCount || ''}</span>
                </button>`;

            const builtinSecond = BUILTIN_TYPES.map(key => { const m = state.categoryMeta[key]; return { key, name: m.name, icon: m.icon, color: m.color }; });
            const customSecond = state.customTypes.map(t => ({ key: t.id, name: t.name, icon: t.icon, color: t.color }));
            const all = [...builtinSecond, ...customSecond];
            const order = state.categoryOrder && state.categoryOrder.length ? state.categoryOrder : defaultOrder();
            all.sort((a, b) => { const ai = order.indexOf(a.key); const bi = order.indexOf(b.key); if (ai === -1 && bi === -1) return 0; if (ai === -1) return 1; if (bi === -1) return -1; return ai - bi; });

            $('#navSecondary').innerHTML = all.map(t => {
                const active = state.view === t.key;
                const count = state.items.filter(i => i.type === t.key && !i.isFolder).length;
                const style = active ? `background:${t.color}1a;color:${t.color};font-weight:600;` : '';
                return `<button data-view="${esc(t.key)}" class="${active ? 'active' : ''}" style="${style}" draggable="true">
                  ${ICON_LIB[t.icon] || ICON_LIB.star}<span class="label">${esc(t.name)}</span><span class="count">${count || ''}</span>
                </button>`;
            }).join('');

            // 计划列表
            const planList = state.plans.map(p => {
                const active = state.currentPlanId === p.id;
                const style = active ? `background:${p.color}1a;color:${p.color};font-weight:600;` : '';
                return `<button data-plan-id="${p.id}" class="${active ? 'active' : ''}" style="${style}">
                            ${ICON_LIB[p.icon] || ICON_LIB.star}<span class="label">${esc(p.name)}</span>
                        </button>`;
            }).join('') || '<div style="font-size:12px;color:#9CA3AF;padding:8px 10px;">暂无计划</div>';
            $('#navPlans').innerHTML = planList;

            bindDragEvents();
        }

        /* =====================================================
           渲染 —— 工具条
        ===================================================== */
        function renderToolbar() {
            const bc = $('#breadcrumb');
            const crumbItems = [];
            if (state.view === 'all') crumbItems.push({ label: '全部收藏', icon: 'grid', color: '#4F6BFF', type: 'root' });
            else if (state.view === 'plan') {
                if (state.currentPlanId) {
                    const p = state.plans.find(x => x.id === state.currentPlanId);
                    crumbItems.push({ label: '全部计划', icon: 'calendar', color: '#8B5CF6', type: 'plan-root' });
                    if (p) crumbItems.push({ label: p.name, icon: p.icon || 'calendar', color: p.color || '#8B5CF6', type: 'plan-detail' });
                } else {
                    crumbItems.push({ label: '全部计划', icon: 'calendar', color: '#8B5CF6', type: 'root' });
                }
            }
            else {
                const info = getTypeInfo(state.view);
                crumbItems.push({ label: info.name, icon: info.icon, color: info.color, type: 'root' });
                state.folderPath.forEach((f, i) => crumbItems.push({ label: f.title, icon: 'folder', color: info.color, type: 'folder', idx: i, id: f.id }));
            }
            bc.innerHTML = crumbItems.map((c, i) => {
                const isLast = i === crumbItems.length - 1;
                const cls = isLast ? 'crumb current' : 'crumb';
                const iconHTML = c.type === 'folder' ? `<span class="crumb-icon" style="color:${c.color}">${ICON_LIB.folder}</span>` : '';
                return `<span class="${cls}" data-crumb-idx="${i}" data-crumb-type="${c.type}" ${c.idx !== undefined ? `data-folder-idx="${c.idx}"` : ''}>${iconHTML}${esc(c.label)}</span>${isLast ? '' : '<span class="sep">›</span>'}`;
            }).join('');
            $('#btnNewFolder').style.display = (state.view === 'plan' || state.view === 'all') ? 'none' : 'inline-flex';

            $$('#breadcrumb .crumb').forEach(el => {
                if (el.classList.contains('current')) return;
                el.onclick = () => {
                    const type = el.dataset.crumbType;
                    if (type === 'root') { state.currentFolderId = null; state.folderPath = []; state.expandedFolders.clear(); }
                    else if (type === 'plan-root') { state.currentPlanId = null; }
                    else if (type === 'folder') {
                        const idx = parseInt(el.dataset.folderIdx, 10);
                        state.folderPath = state.folderPath.slice(0, idx + 1);
                        state.currentFolderId = state.folderPath[state.folderPath.length - 1].id;
                        state.expandedFolders.clear();
                    }
                    renderToolbar(); renderContent(true);
                };
            });
        }

        /* =====================================================
           渲染 —— 内容区
        ===================================================== */
        function renderContent(animate = true) {
            const c = $('#content');
            renderToolbar();

            if (state.view === 'plan') {
                try { renderPlans(c); }
                catch (err) { console.error('renderPlans 出错:', err); c.innerHTML = `<div class="empty"><div class="big">⚠️</div><div>渲染计划时出错</div><div style="font-size:12.5px">${esc(err.message || String(err))}</div></div>`; }
                triggerAnim(c, animate); return;
            }

            if (state.view === 'all') {
                try { renderCategoryEntries(c); }
                catch (err) { console.error('renderCategoryEntries 出错:', err); }
                triggerAnim(c, animate);
                return;
            }

            state.filtered = filterItems();
            state.shown = Math.min(state.pageSize, state.filtered.length);
            if (!state.filtered.length) {
                c.innerHTML = `<div class="empty"><div class="big">📭</div><div>这个分类下还没有内容</div><div style="font-size:12.5px">点右上角「＋ 添加」开始收藏</div></div>`;
                triggerAnim(c, animate); return;
            }
            c.innerHTML = `<div class="grid" id="grid"></div>`; appendCards();
            triggerAnim(c, animate);
        }
        function triggerAnim(c, on) { if (!on) return; c.classList.remove('animating'); void c.offsetWidth; c.classList.add('animating'); }

        /* ===== 全部收藏视图：显示所有大类别 ===== */
        function renderCategoryEntries(c) {
            const entries = [];
            BUILTIN_TYPES.forEach(key => {
                const m = state.categoryMeta[key];
                const count = state.items.filter(i => i.type === key && !i.isFolder).length;
                entries.push({ key, name: m.name, icon: m.icon, color: m.color, count });
            });
            state.customTypes.forEach(t => {
                const count = state.items.filter(i => i.type === t.id && !i.isFolder).length;
                entries.push({ key: t.id, name: t.name, icon: t.icon, color: t.color, count });
            });

            if (!entries.length) {
                c.innerHTML = `<div class="empty"><div class="big">📭</div><div>还没有任何分类</div><div style="font-size:12.5px">点左下角「编辑分类」新建分类</div></div>`;
                return;
            }

            c.innerHTML = `<div class="cat-list">${entries.map((e, i) => `
                <div class="cat-entry" data-cat="${esc(e.key)}" style="animation-delay:${Math.min(i * 40, 400)}ms">
                  <div class="cat-icon-box" style="color:${e.color};background:${e.color}1a">${ICON_LIB[e.icon] || ICON_LIB.star}</div>
                  <div class="cat-info">
                    <div class="cat-name">${esc(e.name)}</div>
                    <div class="cat-sub">${e.count} 项</div>
                  </div>
                  <div class="cat-arrow">${ICON_LIB.chevron}</div>
                </div>
              `).join('')}</div>`;
        }

        /* ===== 分类视图：文件夹 + 内容 ===== */
        function filterItems() {
            let list = state.items;
            list = list.filter(i => i.type === state.view);
            if (state.currentFolderId) {
                list = list.filter(i => i.parentId === state.currentFolderId);
            } else {
                list = list.filter(i => !i.parentId);
            }

            const q = state.search.trim().toLowerCase();
            if (q) {
                list = list.filter(i => {
                    const hay = [i.title, i.note, i.url, i.source, i.status].filter(Boolean).join(' ').toLowerCase();
                    return hay.includes(q);
                });
            }

            list.sort((a, b) => {
                if (a.isFolder && !b.isFolder) return -1;
                if (!a.isFolder && b.isFolder) return 1;
                return (b.updatedAt || 0) - (a.updatedAt || 0);
            });
            return list;
        }

        function appendCards() {
            const grid = $('#grid'); if (!grid) return;
            const slice = state.filtered.slice(state.shown - Math.min(state.pageSize, state.shown), state.shown);
            const startIdx = state.shown - slice.length;
            const html = slice.map((it, i) => cardHTML(it, startIdx + i)).join('');
            grid.insertAdjacentHTML('beforeend', html);
        }

        function cardHTML(it, idx = 0) {
            const delay = Math.min(idx * 25, 400);
            const animStyle = `style="animation-delay:${delay}ms"`;

            if (it.isFolder) {
                const info = getTypeInfo(it.type);
                const children = state.items.filter(x => x.parentId === it.id);
                const subCount = children.length;
                const isExpanded = state.expandedFolders.has(it.id);

                const folderRow = `<div class="card folder" data-id="${it.id}" data-act="toggle-folder">
                  <div class="folder-icon-box" style="color:${info.color};background:${info.color}1a">
                    ${ICON_LIB.folder}
                  </div>
                  <div class="folder-info">
                    <div class="folder-title">${esc(it.title || '未命名类别')}</div>
                    <div class="folder-sub">${subCount} 项</div>
                  </div>
                  <div class="folder-arrow" style="${isExpanded ? 'transform: rotate(90deg);' : ''}">${ICON_LIB.chevron}</div>
                  <button class="folder-enter-btn" data-id="${it.id}" data-act="enter-folder" title="进入该类别">
                    ${ICON_LIB.arrowRight}
                  </button>
                  <button class="folder-edit-btn" data-id="${it.id}" data-act="edit" title="编辑">✎</button>
                </div>`;

                let expandHTML = '';
                if (isExpanded) {
                    if (children.length) {
                        expandHTML = `<div class="folder-expand"><div class="mini-grid">${children.map((c, i) => miniCardHTML(c, i)).join('')}</div></div>`;
                    } else {
                        expandHTML = `<div class="folder-expand"><div class="mini-empty">这个类别还没有内容</div></div>`;
                    }
                }

                return `<div class="folder-block" ${animStyle}>${folderRow}${expandHTML}</div>`;
            }

            return miniCardHTML(it, idx);
        }

        function miniCardHTML(it, idx = 0) {
            const delay = Math.min(idx * 20, 300);
            const animStyle = `style="animation-delay:${delay}ms"`;

            if (it.isFolder) {
                const info = getTypeInfo(it.type);
                return `<div class="mini-card mini-folder" data-id="${it.id}" data-act="enter-folder" ${animStyle}>
                  <div class="mini-folder-icon" style="color:${info.color};background:${info.color}1a">${ICON_LIB.folder}</div>
                  <div class="mini-title">${esc(it.title || '未命名')}</div>
                </div>`;
            }

            const info = getTypeInfo(it.type);
            const u = getURL(it);
            let inner = '';
            if (it.type === 'image' && u) {
                inner = `<img src="${u}" loading="lazy" alt="">`;
            } else if (it.type === 'site') {
                let host = ''; try { host = new URL(it.url).hostname.replace(/^www\./, ''); } catch (e) { host = it.url || ''; }
                const letter = (it.title || host || '?').trim().charAt(0).toUpperCase();
                inner = `<div class="mini-ph">${esc(letter)}</div>`;
            } else if (u) {
                inner = `<img src="${u}" loading="lazy" alt="">`;
            } else {
                inner = `<div class="mini-ph-icon" style="color:${info.color}">${ICON_LIB[info.icon] || ICON_LIB.star}</div>`;
            }

            let act = 'edit';
            if (it.type === 'image' && u) act = 'view';
            else if (it.url) act = 'open';

            return `<div class="mini-card" data-id="${it.id}" data-act="${act}" ${animStyle}>
                ${inner}
                <button class="editbtn" data-id="${it.id}" data-act="edit" title="编辑">✎</button>
                <div class="mini-title">${esc(it.title || '未命名')}</div>
              </div>`;
        }

        /* =====================================================
           渲染 —— 计划（核心重构部分）
        ===================================================== */
        function renderPlans(c) {
            // 如果指定了某个计划，只显示该计划详情
            if (state.currentPlanId) {
                const p = state.plans.find(x => x.id === state.currentPlanId);
                if (!p) { state.currentPlanId = null; renderContent(false); return; }
                c.innerHTML = `<div class="plan-layout">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <h2 style="font-size:18px;font-weight:700;color:var(--text);">${esc(p.name)}</h2>
                                <button class="btn ghost" id="btnBackToPlans" style="font-size:13px;padding:8px 14px;">← 返回全部计划</button>
                            </div>
                            <div id="planDetailCard"></div>
                        </div>`;
                const detailContainer = $('#planDetailCard');
                detailContainer.innerHTML = planCardHTML(p, 0, true);
                $('#btnBackToPlans').onclick = () => { state.currentPlanId = null; renderNav(); renderContent(true); };
                return;
            }

            // 全部计划视图：大日历 + 提醒 + 计划卡片列表
            const today = todayStr();
            let calendarHTML = renderCalendar();
            let reminderHTML = renderReminders();
            let plansHTML = state.plans.length
                ? state.plans.map((p, i) => planCardHTML(p, i)).join('')
                : `<div class="empty"><div class="big">🎯</div><div>还没有计划</div><div style="font-size:12.5px">点右上角「＋ 添加」新建一个计划</div></div>`;

            c.innerHTML = `<div class="plan-layout">
                        ${calendarHTML}
                        ${reminderHTML}
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <h3 style="font-size:16px;font-weight:700;color:var(--text);">我的计划</h3>
                            <button class="btn" id="btnNewPlanTop" style="font-size:13px;padding:8px 16px;">＋ 新建计划</button>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:16px;">${plansHTML}</div>
                    </div>`;

            if ($('#btnNewPlanTop')) $('#btnNewPlanTop').onclick = () => openPlanEditor(null);
        }

        /* ===== 大日历渲染 ===== */
        let currentCalMonth = new Date();
        let selectedCalDate = null;

        function renderCalendar() {
            const y = currentCalMonth.getFullYear();
            const m = currentCalMonth.getMonth();
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const today = todayStr();
            const plans = state.plans;
            const planTotal = plans.length;

            let cells = '';
            for (let i = 0; i < firstDay; i++) cells += `<div class="cal-cell empty"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayLogs = state.logs.filter(l => l.date === ds);
                const donePlanIds = new Set(dayLogs.map(l => l.planId));
                const isToday = ds === today;
                const isPast = ds < today;
                const hasLog = dayLogs.length > 0;

                let cls = 'cal-cell';
                if (isToday) cls += ' today';
                const planExistsOn = planTotal > 0 && plans.some(p => {
                    if (p.kind === 'record') return false;   // 记录型不参与未打卡判定
                    const created = p.createdAt ? dateStr(new Date(p.createdAt)) : null;
                    return !created || created <= ds;        // 没有创建日期就当作一直存在
                });
                if (hasLog) cls += ' has-log';
                else if (isPast && planExistsOn) cls += ' missed';
                if (selectedCalDate === ds) cls += ' selected';

                let dots = '';
                if (planTotal) {
                    const shown = plans.slice(0, 6);
                    dots = `<div class="cal-dots">${shown.map(p =>
                        `<i style="background:${donePlanIds.has(p.id) ? (p.color || '#4F6BFF') : '#E5E7EB'}"></i>`
                    ).join('')}</div>`;
                }

                cells += `<div class="${cls}" data-date="${ds}" title="${ds} 点击查看详情">${d}${dots}</div>`;
            }

            const detailHTML = selectedCalDate ? renderDayDetail(selectedCalDate) : '';
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];

            return `<div class="calendar-box">
                        <div class="cal-head">
                            <div class="cal-title">${y}年 ${monthNames[m]}</div>
                            <div class="cal-nav">
                                <button id="calPrev">‹</button>
                                <button id="calNext">›</button>
                            </div>
                        </div>
                        <div class="cal-grid">
                            ${WEEK_DAYS.map(w => `<div class="cal-w">${w}</div>`).join('')}
                            ${cells}
                        </div>
                        <div class="cal-legend">
                            <span><span class="lg-box" style="background:#ECFDF5;border:1px solid #10B981;"></span>有打卡</span>
                            <span><span class="lg-box" style="background:#FEF2F2;border:1px solid #EF4444;"></span>未打卡</span>
                            <span><span class="lg-box" style="background:#EEF2FF;border:1px solid #4F6BFF;"></span>今天</span>
                            <span style="color:#9CA3AF">· 格内小圆点＝各计划，彩色＝已打卡，灰色＝未打卡，点击日期看详情</span>
                        </div>
                        ${detailHTML}
                    </div>`;
        }

        /* ===== 某一天的计划详情 ===== */
        function renderDayDetail(ds) {
            const dayLogs = state.logs.filter(l => l.date === ds);
            const donePlanIds = new Set(dayLogs.map(l => l.planId));
            const rows = [];
            const missing = [];
            const activePlans = state.plans.filter(p => p.kind !== 'record');   // 记录型不计入待打卡统计

            state.plans.forEach(p => {
                const color = p.color || '#4F6BFF';
                const pLogs = dayLogs.filter(l => l.planId === p.id);
                if (!pLogs.length) {
                    if (p.kind !== 'record') missing.push({ name: p.name, color });
                    return;
                }

                const isNum = p.kind === 'number';
                const parts = pLogs.map(l => {
                    const en = (p.entries || []).find(x => x.id === l.entryId);
                    const nm = en ? en.name : '记录';
                    return isNum
                        ? `${esc(nm)}：<b>${esc(String(l.value))}</b>${p.unit ? ' ' + esc(p.unit) : ''}`
                        : esc(nm);
                });

                rows.push(`<div class="dd-row">
                            <span class="dd-dot" style="background:${color}"></span>
                            <span class="dd-name">${esc(p.name)}</span>
                            <span class="dd-val">${parts.join('　·　')}</span>
                        </div>`);
            });

            const missingHTML = missing.length
                ? `<div class="dd-miss">未打卡：
                            ${missing.map(mm => `<span class="dd-miss-item"><i style="background:${mm.color}"></i>${esc(mm.name)}</span>`).join('')}
                       </div>`
                : '';

            const body = (rows.length || missingHTML)
                ? `${rows.join('')}${missingHTML}`
                : '<div class="dd-empty">还没有任何计划</div>';

            return `<div class="day-detail">
                        <div class="dd-head">
                            <span class="dd-title">${esc(ds)} 打卡详情</span>
                                                    <span class="dd-sum">${activePlans.filter(ap => donePlanIds.has(ap.id)).length} / ${activePlans.length} 个计划已打卡</span>
                        </div>
                        <div class="dd-list">${body}</div>
                    </div>`;
        }

        /* ===== 提醒渲染 ===== */
        function renderReminders() {
            const today = todayStr();
            const dueItems = [];

            state.plans.forEach(p => {
                // 数值型计划：每天提醒
                if (p.kind === 'number') {
                    const hasLogToday = state.logs.some(l => l.planId === p.id && l.date === today);
                    if (!hasLogToday) {
                        dueItems.push({ planId: p.id, planName: p.name, text: `${p.name} 今日还未记录体重`, entryId: p.entries[0]?.id });
                    }
                }
                // 打卡型/周期型计划：根据 nextDueDate 提醒
                if (p.kind === 'check' || p.kind === 'frequency') {
                    (p.entries || []).forEach(e => {
                        let due = false;
                        if (e.freqDays && e.lastCheckinDate) {
                            const next = addDays(e.lastCheckinDate, e.freqDays);
                            if (next <= today) due = true;
                        } else {
                            // 每日打卡型，检查今天有没有打卡
                            const hasLogToday = state.logs.some(l => l.planId === p.id && l.entryId === e.id && l.date === today);
                            if (!hasLogToday) due = true;
                        }
                        if (due) {
                            dueItems.push({ planId: p.id, planName: p.name, text: `${p.name} · ${e.name} 到了打卡时间`, entryId: e.id });
                        }
                    });
                }
            });

            const html = dueItems.length
                ? dueItems.map(item => `
                            <div class="reminder-item">
                                <span class="r-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg></span>
                                <span class="r-text">${esc(item.text)}</span>
                                <button class="r-action" data-goto-plan="${item.planId}" data-goto-entry="${item.entryId}">去打卡 →</button>
                            </div>`).join('')
                : '<div style="font-size:13px;color:#9CA3AF;padding:6px 0;">暂无待办提醒，一切正常 🎉</div>';

            return `<div class="reminder-box">
                        <div class="reminder-title">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#EF4444" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                            待打卡提醒
                        </div>
                        <div class="reminder-list">${html}</div>
                    </div>`;
        }

        /* ===== 计划卡片渲染 ===== */
        function planCardHTML(p, idx = 0, isDetail = false) {
            const today = todayStr();
            const logs = state.logs.filter(l => l.planId === p.id);
            const todayLogs = logs.filter(l => l.date === today);
            const entries = p.entries || [];
            const doneCount = entries.filter(e => todayLogs.some(l => l.entryId === e.id)).length;
            const isNum = p.kind === 'number';
            const icon = p.icon || (isNum ? 'heart' : 'flag');
            const color = p.color || '#4F6BFF';

            const rows = entries.map(e => {
                const log = todayLogs.find(l => l.entryId === e.id);
                const done = !!log;
                let mid = '';
                if (isNum) {
                    if (done) {
                        mid = `<span class="entry-value">${esc(String(log.value))}${p.unit ? ' ' + esc(p.unit) : ''}</span>`;
                    } else {
                        const prev = logs.filter(l => l.entryId === e.id).sort((a, b) => a.date.localeCompare(b.date)).pop();
                        mid = `<input class="entry-val" type="number" step="any" inputmode="decimal"
                                    placeholder="${prev ? esc(String(prev.value)) : '数值'}"
                                    data-plan="${p.id}" data-entry-val="${e.id}">`;
                    }
                } else if (p.kind === 'frequency' || e.freqDays) {
                    // 周期型：显示上次打卡日期 + 距下次还有多久
                    const freq = Number(e.freqDays) || 1;
                    const lastText = e.lastCheckinDate ? e.lastCheckinDate.slice(5) : '无';
                    let nextText = '首次待打卡';
                    let diff = null;
                    if (e.lastCheckinDate) {
                        const nextDate = addDays(e.lastCheckinDate, freq);
                        diff = daysBetween(today, nextDate);
                        if (diff > 0) nextText = `还有 ${diff} 天`;
                        else if (diff === 0) nextText = '今天要打卡';
                        else nextText = `已逾期 ${-diff} 天`;
                    }
                    let pill = 'background:#F3EEFF;color:#8B5CF6;';
                    if (diff !== null && diff < 0) pill = 'background:#FEF2F2;color:#B91C1C;';
                    else if (diff === 0) pill = 'background:#FEF3C7;color:#92400E;';
                    mid = `<span class="entry-value" style="${pill}"
                                  title="上次打卡：${esc(e.lastCheckinDate || '暂无')} · 周期：每 ${freq} 天">上次: ${esc(lastText)} · ${esc(nextText)}</span>`;
                }

                let checkBtn = '';
                if (isNum) {
                    checkBtn = `<button class="entry-check ${done ? 'done' : ''}" data-act="check" data-plan="${p.id}" data-entry="${e.id}">${done ? '✓ 已记录' : '记录'}</button>`;
                } else {
                    checkBtn = `<button class="entry-check ${done ? 'done' : ''}" data-act="check" data-plan="${p.id}" data-entry="${e.id}">${done ? '✓ 已打卡' : '打卡'}</button>`;
                }

                return `<div class="entry-row">
                            <span class="entry-name" data-act="entry-history" data-plan="${p.id}" data-entry="${e.id}" title="查看记录">${esc(e.name)}</span>
                            ${mid}
                            ${checkBtn}
                            <button class="entry-cancel" data-act="uncheck" data-plan="${p.id}" data-entry="${e.id}" ${done ? '' : 'disabled'} title="取消打卡">✕</button>
                        </div>`;
            }).join('') || `<div style="font-size:12.5px;color:#9CA3AF;padding:12px;text-align:center">还没有${isNum ? '成员' : '任务'}，点右上角 ✎ 添加</div>`;

            let strip = '';
            const base = new Date();
            for (let i = 13; i >= 0; i--) {
                const d = new Date(base); d.setDate(d.getDate() - i);
                const s = dateStr(d);
                const on = logs.some(l => l.date === s);
                strip += `<i class="${on ? 'on' : ''}" title="${s}"></i>`;
            }

            const createdStr = p.createdAt ? fmtDate(p.createdAt) : '';
            const sub = `${entries.length} 位${isNum ? '成员' : '任务'} · 今日 ${doneCount}/${entries.length}${createdStr ? ` · 创建于 ${createdStr.slice(5)}` : ''}`;

            return `<div class="plan-card" style="--plan-color:${color};animation-delay:${Math.min(idx * 40, 400)}ms">
                        <div class="plan-head">
                            <div class="plan-icon" style="color:${color};background:${color}1a">${ICON_LIB[icon] || ICON_LIB.star}</div>
                            <div class="plan-titles">
                                <div class="plan-name">${esc(p.name)}</div>
                                <div class="plan-sub">${sub}</div>
                            </div>
                            ${isDetail ? '' : `<button class="plan-edit" data-act="plan-edit" data-plan="${p.id}" title="编辑计划">✎</button>`}
                        </div>
                        <div class="plan-entries">${rows}</div>
                        ${isDetail ? '' : `<div class="plan-strip">${strip}</div>`}
                    </div>`;
        }

        /* ===== 打卡 / 取消打卡 ===== */
        async function doCheckIn(planId, entryId) {
            const p = state.plans.find(x => x.id === planId); if (!p) return;
            const entry = (p.entries || []).find(x => x.id === entryId); if (!entry) return;
            const today = todayStr();
            if (state.logs.some(l => l.planId === planId && l.entryId === entryId && l.date === today)) { toast('今天已经打过卡了'); return; }

            let value = 1;
            if (p.kind === 'number') {
                const input = document.querySelector(`.entry-val[data-plan="${planId}"][data-entry-val="${entryId}"]`);
                let v = input ? parseFloat(input.value) : NaN;
                if (isNaN(v)) {
                    const prev = state.logs.filter(l => l.planId === planId && l.entryId === entryId).sort((a, b) => a.date.localeCompare(b.date)).pop();
                    if (prev) v = Number(prev.value);
                }
                if (isNaN(v)) { toast('请先填写数值', true); if (input) input.focus(); return; }
                value = v;
            }
            await idbPut('logs', { id: uid(), planId, entryId, date: today, value });

            // 如果是周期型任务，更新下一次打卡日期
            if (entry.freqDays) {
                entry.lastCheckinDate = today;
                p.updatedAt = Date.now();
                await idbPut('plans', p);
            }

            await loadAll();   // loadAll 会自动写盘
            renderContent(false);
            toast('打卡成功 ✓');
        }

        async function doUncheck(planId, entryId) {
            const today = todayStr();
            const logs = state.logs.filter(l => l.planId === planId && l.entryId === entryId && l.date === today);
            if (!logs.length) { toast('今天还没有打卡'); return; }
            for (const l of logs) await idbDel('logs', l.id);

            // 如果是周期型任务，回退 lastCheckinDate
            const p = state.plans.find(x => x.id === planId);
            if (p) {
                const entry = (p.entries || []).find(e => e.id === entryId);
                if (entry && entry.freqDays) {
                    const prevLogs = state.logs.filter(l => l.planId === planId && l.entryId === entryId && l.date < today).sort((a, b) => b.date.localeCompare(a.date));
                    entry.lastCheckinDate = prevLogs.length ? prevLogs[0].date : null;
                    p.updatedAt = Date.now();
                    await idbPut('plans', p);
                }
            }

            await loadAll();   // loadAll 会自动写盘
            renderContent(false);
            toast('已取消打卡');
        }

        /* ===== 单条目历史记录 ===== */
        function openEntryHistory(planId, entryId) {
            const p = state.plans.find(x => x.id === planId); if (!p) return;
            const entry = (p.entries || []).find(e => e.id === entryId); if (!entry) return;
            const logs = state.logs.filter(l => l.planId === planId && l.entryId === entryId).sort((a, b) => a.date.localeCompare(b.date));
            const isNum = p.kind === 'number';

            let body = '';
            if (isNum) {
                body = `<div style="background:rgba(255,255,255,0.6);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px"><canvas id="chart" style="width:100%;height:180px;display:block"></canvas></div>`;
            } else {
                const dates = new Set(logs.map(l => l.date));
                let heat = '';
                for (let i = 89; i >= 0; i--) {
                    const d = new Date(); d.setDate(d.getDate() - i);
                    const s = dateStr(d);
                    heat += `<div title="${s}" style="width:14px;height:14px;border-radius:4px;background:${dates.has(s) ? 'var(--ok)' : '#E5E7EB'}"></div>`;
                }
                body = `<div style="background:rgba(255,255,255,0.6);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px">
                            <div style="font-size:12px;color:var(--dim);margin-bottom:10px">最近 90 天打卡</div>
                            <div style="display:grid;grid-template-columns:repeat(15,1fr);gap:4px">${heat}</div></div>`;
            }

            const list = [...logs].reverse().slice(0, 120).map(l => `
                        <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid rgba(0,0,0,0.05);font-size:13px">
                          <span style="color:var(--dim);font-size:12px;min-width:82px">${l.date}</span>
                          <span style="flex:1">${isNum ? esc(String(l.value)) + (p.unit ? ' ' + esc(p.unit) : '') : '✔ 已打卡'}</span>
                          <button data-logdel="${l.id}" style="border:0;background:transparent;color:#9CA3AF;cursor:pointer;font-size:12px">删除</button>
                        </div>`).join('') || '<div style="color:#9CA3AF;font-size:12.5px;padding:10px">还没有记录</div>';

            openModal(`<h3>${esc(entry.name)} · 记录</h3>${body}
                        <div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.4)">${list}</div>
                        <div class="modal-actions"><span class="sp"></span><button class="btn ghost" id="eh-close">关闭</button></div>`, true);

            if (isNum) drawChart($('#chart'), logs);
            $('#eh-close').onclick = closeModal;
            $$('[data-logdel]').forEach(b => {
                b.onclick = async () => {
                    await idbDel('logs', b.dataset.logdel);
                    await loadAll();
                    openEntryHistory(planId, entryId);
                    renderContent(false);
                };
            });
        }

        /* =====================================================
           模态框
        ===================================================== */
        function openModal(html, wide) {
            const root = $('#modalRoot');
            root.innerHTML = `<div class="modal-mask"><div class="modal ${wide ? 'wide' : ''}">${html}</div></div>`;
            root.style.display = 'block';
            root.querySelector('.modal-mask').addEventListener('mousedown', e => { if (e.target.classList.contains('modal-mask')) closeModal(); });
        }
        function closeModal() { const root = $('#modalRoot'); root.style.display = 'none'; root.innerHTML = ''; }

        /* =====================================================
           类别管理（收藏）
        ===================================================== */
        function openNewFolderDialog() {
            if (state.view === 'plan') { toast('计划分类下不能创建类别'); return; }
